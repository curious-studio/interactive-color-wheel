<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="screen-orientation" content="portrait">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#cf244c">
    <title>Inside Color Wheel</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="stylesheet" href="./styles.css?v=0.4&layout=motion-tune">
  </head>
  <body>
    <main class="app-shell" aria-label="Color Compass">
      <section class="sensor-panel" aria-label="Live color selector">
        <div class="ambient-wheel" aria-hidden="true"></div>

        <div class="top-cluster">
          <div class="top-bar">
            <div>
              <p class="eyebrow">COLOR COMPASS (v0.4)</p>
            </div>
            <button class="sensor-button" id="sensorButton" type="button" aria-pressed="false">
              <span id="sensorButtonLabel">Enable Sensors</span>
              <span class="sensor-toggle" aria-hidden="true"><span></span></span>
            </button>
          </div>

        </div>

        <div class="live-zone">
          <div class="sample-card" id="sampleCard" role="img" aria-label="Current selected color"></div>
          <div class="swatch-actions" id="swatchActions">
            <button class="add-button" id="addSwatchButton" type="button">Add Swatch</button>
            <button class="add-button replace-button" id="replaceSwatchButton" type="button" disabled>
              <svg class="replace-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20 10a8 8 0 0 0-13.4-5.8L4 7"></path>
                <path d="M4 3v4h4"></path>
                <path d="M4 14a8 8 0 0 0 13.4 5.8L20 17"></path>
                <path d="M20 21v-4h-4"></path>
              </svg>
              Replace
            </button>
          </div>
          <p class="status-line" id="statusLine">Use the controls below, or enable motion sensors on a phone.</p>
        </div>

        <div class="action-row">
          <div class="readout-strip" aria-live="polite">
            <span><strong id="hueValue">0°</strong> hue</span>
            <span><strong id="lightValue">50%</strong> light</span>
            <span><strong id="satValue">88%</strong> saturation</span>
          </div>
          <button class="ghost-button" id="copyButton" type="button">Save</button>
        </div>

        <section class="swatch-tray" aria-label="Saved swatches">
          <div class="swatches" id="swatches"></div>
        </section>

        <form class="fallback-controls" aria-label="Manual color controls">
          <label>
            <span>Hue</span>
            <input id="hueControl" type="range" min="0" max="359" value="0">
          </label>
          <label>
            <span>Brightness</span>
            <input id="tintControl" type="range" min="-50" max="50" value="0">
          </label>
          <label>
            <span>Saturation</span>
            <input id="satControl" type="range" min="0" max="100" value="88">
          </label>
        </form>
      </section>
    </main>

    <script src="./script.js?v=0.4&layout=motion-tune"></script>
  </body>
</html>
